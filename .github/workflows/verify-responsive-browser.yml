name: Verify Responsive Browser UX

on:
  pull_request:
    branches: [main]
    paths:
      - 'local/**'
      - 'live/**'
      - 'runtime/models/exo-provider.mjs'
      - 'observer/experiments/responsive-browser/**'
      - '.github/workflows/verify-responsive-browser.yml'
  push:
    branches: [main]
    paths:
      - 'local/**'
      - 'live/**'
      - 'runtime/models/exo-provider.mjs'
      - 'observer/experiments/responsive-browser/**'
      - '.github/workflows/verify-responsive-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned Playwright harness
        run: npm install --no-save playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify responsive layouts and simulated exo browser flow
        run: node observer/experiments/responsive-browser/verify.mjs
      - name: Upload responsive audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-audit
          path: artifacts/responsive
          if-no-files-found: ignore
