name: Verify Shadow Autobiographical Recall

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-shadow-recall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify deterministic recall without causal authority
        run: node observer/experiments/shadow-recall/verify.mjs
