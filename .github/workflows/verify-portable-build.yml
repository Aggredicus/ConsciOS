name: Verify Portable Modular Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-portable-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build and verify portable HTML
        run: node observer/experiments/portable-build/verify.mjs
      - name: Upload portable ConsciOS HTML
        uses: actions/upload-artifact@v7
        with:
          name: conscios-portable-html
          path: dist/conscios-modular.html
          if-no-files-found: error
