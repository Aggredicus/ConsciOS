name: Verify Causal Agency Attribution

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-agency-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify provenance-based self/external attribution
        run: node observer/experiments/agency-attribution/verify.mjs
