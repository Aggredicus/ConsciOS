name: Verify Self-Model Studio

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Verify source syntax and v0.1 memory fabric
        run: |
          node --check scripts/self-model-graph-v2.mjs
          node --check scripts/repo-quality-governance-audit.mjs
          node --check scripts/self-model-mcp.mjs
          node --check scripts/self-model-history.mjs
          node --check scripts/self-model-studio-bundle.mjs
          node --check scripts/governance-issue-candidates.mjs
          node --check tools/self-model-studio/tooltip.js
          node scripts/self-model-history.mjs --self-test
          node scripts/self-model-memory.mjs verify

      - name: Capture PR before and after snapshots
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/self-model-memory.mjs snapshot
          --base '${{ github.event.pull_request.base.sha }}'
          --head '${{ github.event.pull_request.head.sha }}'
          --event self-model-studio-pr
          --out .self-model-studio-ci

      - name: Capture main before and after snapshots
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: >-
          node scripts/self-model-memory.mjs snapshot
          --base '${{ github.event.before }}'
          --head '${{ github.sha }}'
          --event self-model-studio-main
          --out .self-model-studio-ci

      - name: Build fallback snapshot for manual or first push
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        run: |
          mkdir -p .self-model-studio-ci
          node scripts/self-model-memory.mjs build --out .self-model-studio-ci/after
          cp -R .self-model-studio-ci/after .self-model-studio-ci/before

      - name: Audit repository quality and governance decisions
        run: >-
          node scripts/repo-quality-governance-audit.mjs
          --snapshot .self-model-studio-ci/after
          --out .self-model-studio-ci/after/governance

      - name: Verify normalized graph and create graph diff
        run: |
          node scripts/self-model-graph-v2.mjs verify .self-model-studio-ci/before
          node scripts/self-model-graph-v2.mjs normalize .self-model-studio-ci/before --out .self-model-studio-ci/before/ontology/current.v2.json
          node scripts/self-model-graph-v2.mjs verify .self-model-studio-ci/after --findings .self-model-studio-ci/after/governance/audit.json
          node scripts/self-model-graph-v2.mjs normalize .self-model-studio-ci/after --findings .self-model-studio-ci/after/governance/audit.json --out .self-model-studio-ci/after/ontology/current.v2.json
          node scripts/self-model-graph-v2.mjs compact .self-model-studio-ci/after --findings .self-model-studio-ci/after/governance/audit.json --out .self-model-studio-ci/after/ontology/compact.v2.json
          node scripts/self-model-graph-v2.mjs diff .self-model-studio-ci/before .self-model-studio-ci/after --head-findings .self-model-studio-ci/after/governance/audit.json --out .self-model-studio-ci/diff.v2.json

      - name: Generate governance issue candidates
        run: >-
          node scripts/governance-issue-candidates.mjs
          --audit .self-model-studio-ci/after/governance/audit.json
          --out .self-model-studio-ci/after/governance/issue-candidates.json

      - name: Build temporal history for PR epoch
        if: github.event_name == 'pull_request'
        run: >-
          node scripts/self-model-history.mjs build
          --from '${{ github.event.pull_request.base.sha }}'
          --head '${{ github.event.pull_request.head.sha }}'
          --all
          --out .self-model-studio-ci/history.v1.json

      - name: Build temporal history for main push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: >-
          node scripts/self-model-history.mjs build
          --from '${{ github.event.before }}'
          --head '${{ github.sha }}'
          --all
          --out .self-model-studio-ci/history.v1.json

      - name: Build bounded temporal history for manual or first push
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000')
        run: >-
          node scripts/self-model-history.mjs build
          --head '${{ github.sha }}'
          --max-frames 12
          --first-parent
          --out .self-model-studio-ci/history.v1.json

      - name: Verify temporal history replay
        run: node scripts/self-model-history.mjs verify .self-model-studio-ci/history.v1.json

      - name: Build standalone static graph studio
        run: >-
          node scripts/self-model-studio-bundle.mjs
          --data .self-model-studio-ci/diff.v2.json
          --history .self-model-studio-ci/history.v1.json
          --out .self-model-studio-ci/studio/index.html

      - name: Verify serverless and bounded MCP surface
        env:
          CONSCIOS_SELF_MODEL_DIR: .self-model-studio-ci/after
          CONSCIOS_SELF_MODEL_HISTORY: .self-model-studio-ci/history.v1.json
        run: |
          node scripts/self-model-mcp.mjs --self-test
          if grep -En "node:(http|https|net)|createServer\(|\.listen\(" scripts/self-model-mcp.mjs scripts/self-model-history.mjs; then
            echo 'Network server primitive found in local self-model tooling' >&2
            exit 1
          fi
          if grep -En "innerHTML\s*=|insertAdjacentHTML|document\.write|<script[^>]+src=|http://" tools/self-model-studio/index.html tools/self-model-studio/tooltip.js; then
            echo 'Unsafe or network-dependent viewer primitive found' >&2
            exit 1
          fi
          grep -q 'node-tooltip' .self-model-studio-ci/studio/index.html
          grep -q 'history-data' .self-model-studio-ci/studio/index.html
          grep -q 'commits/s' .self-model-studio-ci/studio/index.html
          if grep -Eiq "<script[^>]+src=[\"']?https?://|<link[^>]+href=[\"']?https?://|<iframe[^>]+src=[\"']?https?://" .self-model-studio-ci/studio/index.html; then
            echo 'Standalone viewer unexpectedly depends on an external runtime resource' >&2
            exit 1
          fi

      - name: Upload inspectable studio and graph evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conscios-self-model-studio-${{ github.sha }}
          path: .self-model-studio-ci
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
