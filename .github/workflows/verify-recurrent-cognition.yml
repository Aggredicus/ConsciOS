name: Verify Recurrent Multi-Cycle Cognition

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-recurrent-cognition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify temporal recurrence and stateless control
        run: node observer/experiments/recurrent-cognition/verify.mjs
