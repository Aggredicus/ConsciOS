name: Deploy ConsciOS Live Theater to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live theater before publishing
        run: node observer/experiments/live-theater/verify.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R cognition runtime live _site/
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0; url=./live/"><title>ConsciOS Live Cognitive Theater</title></head><body><p><a href="./live/">Open ConsciOS Live Cognitive Theater</a></p></body></html>
          HTML
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
