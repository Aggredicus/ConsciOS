name: Verify Browser Entrypoints

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-browser-entrypoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse browser entrypoints and verify Encounter bootstrap
        run: node observer/experiments/browser-entrypoints/verify.mjs
