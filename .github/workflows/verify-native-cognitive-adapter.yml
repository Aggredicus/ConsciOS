name: Verify Native Cognitive Adapter v2
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node observer/experiments/native-cognitive-adapter-v2/verify.mjs
