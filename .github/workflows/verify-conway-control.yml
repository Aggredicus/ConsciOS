name: Verify Conway control laboratory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-control-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node observer/experiments/conway-control/verify.mjs
      - name: Collect current static Conway metrics
        run: node scripts/collect-conway-static-metrics.mjs > /tmp/conway-static.json && cat /tmp/conway-static.json
