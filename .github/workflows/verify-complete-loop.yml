name: Verify Complete Deterministic Loop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-complete-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Counterfactual → Homeostasis → Guardian → Executive path
        run: node observer/experiments/complete-loop/verify.mjs
