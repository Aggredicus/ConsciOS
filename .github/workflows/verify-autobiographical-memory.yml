name: Verify Autobiographical Memory Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-autobiographical-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify hash-linked continuity semantics
        run: node observer/experiments/autobiographical-memory/verify.mjs
