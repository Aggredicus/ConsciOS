# Build, verify, and deploy the compact ConsciOS browser surface.
name: Deploy compact ConsciOS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify compact UI
        run: node observer/experiments/notebook-workbench/verify.mjs

      - name: Build exact transitive Pages site
        run: node scripts/build-pages-site.mjs --output _site --max-bytes 70000

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload compact artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
