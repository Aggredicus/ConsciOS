name: Verify Browser Continuity Isolation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-browser-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify opt-in persistence without recall authority
        run: node observer/experiments/continuity-browser/verify.mjs
