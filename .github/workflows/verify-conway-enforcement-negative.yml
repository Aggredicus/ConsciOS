name: Verify Inverse Conway enforcement negative controls

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fail-closed-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prove forbidden cases are rejected
        run: node observer/experiments/conway-enforcement/verify.mjs
