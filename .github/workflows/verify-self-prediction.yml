name: Verify Architectural Self-Prediction

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-self-prediction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify pre-registered predictions against isolated perturbations
        run: node observer/experiments/self-prediction/verify.mjs
