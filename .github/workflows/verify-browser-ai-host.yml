name: Verify Browser AI Host

on:
  pull_request:
    paths:
      - 'runtime/models/**'
      - 'local/**'
      - 'observer/experiments/browser-ai-host/**'
      - 'observer/experiments/swarm-pairing/**'
      - '.github/workflows/verify-browser-ai-host.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/models/**'
      - 'local/**'
      - 'observer/experiments/browser-ai-host/**'
      - 'observer/experiments/swarm-pairing/**'
      - '.github/workflows/verify-browser-ai-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify browser-local model host contract
        run: node observer/experiments/browser-ai-host/verify.mjs
      - name: Verify hosted local browser lab
        run: node observer/experiments/browser-ai-host/verify-local-ui.mjs
      - name: Verify real CognitiveEvent architecture trace
        run: node observer/experiments/browser-ai-host/verify-architecture-trace.mjs
      - name: Verify recurrent scientific controls
        run: node observer/experiments/browser-ai-host/verify-scientific-controls.mjs
      - name: Verify serverless swarm pairing contracts
        run: node observer/experiments/swarm-pairing/verify.mjs

  real-browser-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start ConsciOS browser host
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/conscios-http.log 2>&1 &
          echo $! > /tmp/conscios-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/local/workbench/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/conscios-http.log
          exit 1
      - name: Verify two-browser serverless swarm pairing
        env:
          CONSCIOS_BASE_URL: http://127.0.0.1:8000
        run: node observer/experiments/swarm-pairing/e2e.mjs
      - name: Download and run a real model in Chromium
        env:
          CONSCIOS_BASE_URL: http://127.0.0.1:8000
        run: node observer/experiments/browser-ai-host/e2e-real-model.mjs
