name: Verify role-aware subsystem CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  role-aware-fast-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run directly impacted roles and one-hop declared neighbors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/run-subsystem-ci.mjs --execute
