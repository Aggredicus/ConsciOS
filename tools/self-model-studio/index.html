<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ConsciOS Self-Model Studio</title>
<meta name="color-scheme" content="dark light">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#0a0d12;--panel:#11161f;--line:#273143;--text:#eef2f7;--muted:#97a4b7;--accent:#8ab4ff;--add:#35d07f;--remove:#ff6666;--change:#f7c948;--same:#718096;--finding:#cf8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);overflow:hidden}button,input,select{font:inherit}button,.fileLabel,select,input[type=search]{border:1px solid var(--line);background:#151c27;color:var(--text);border-radius:8px;padding:.48rem .68rem}button,.fileLabel{cursor:pointer}button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:auto 1fr}.toolbar{grid-column:1/-1;display:flex;align-items:center;gap:.5rem;padding:.6rem .75rem;border-bottom:1px solid var(--line);background:rgba(10,13,18,.96);overflow-x:auto}.brand{font-weight:700;white-space:nowrap;margin-right:.4rem}.spacer{flex:1}.fileLabel input{display:none}.stage{position:relative;min-width:0;min-height:0}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;left:.7rem;bottom:.7rem;background:rgba(17,22,31,.86);border:1px solid var(--line);border-radius:9px;padding:.45rem .6rem;font-size:.78rem;color:var(--muted);pointer-events:none}.side{border-left:1px solid var(--line);background:var(--panel);min-height:0;display:flex;flex-direction:column}.searchBox{padding:.75rem;border-bottom:1px solid var(--line)}.searchBox input{width:100%}.results{max-height:32%;overflow:auto;border-bottom:1px solid var(--line)}.result{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid rgba(39,49,67,.6);padding:.55rem .7rem;background:transparent}.result:hover,.result:focus{background:#182131}.result small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.inspector{padding:.8rem;overflow:auto;flex:1}.inspector h2{font-size:1rem;margin:.1rem 0 .5rem}.kv{display:grid;grid-template-columns:88px 1fr;gap:.3rem .5rem;font-size:.78rem;margin:.25rem 0}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.badge{display:inline-block;padding:.14rem .4rem;border:1px solid var(--line);border-radius:999px;font-size:.7rem;margin:.1rem .18rem .1rem 0}.legend{display:flex;gap:.65rem;align-items:center;font-size:.75rem;color:var(--muted);white-space:nowrap}.dot{width:.65rem;height:.65rem;border-radius:50%;display:inline-block}.timeline{display:flex;align-items:center;gap:.35rem;white-space:nowrap}.timeline input{width:110px}.notice{font-size:.78rem;color:var(--muted);padding:.7rem}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto 62% 1fr}.side{border-left:0;border-top:1px solid var(--line)}.results{max-height:42%}.toolbar{padding:.5rem}.legend{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<header class="toolbar"><div class="brand">Self-Model Studio</div><label class="fileLabel">Open graph <input id="file" type="file" accept="application/json,.json"></label><button id="mode2d" type="button" aria-pressed="true">2D</button><button id="mode3d" type="button" aria-pressed="false">3D</button><select id="status" aria-label="Diff status filter"><option value="all">All states</option><option value="added">Added</option><option value="removed">Removed</option><option value="changed">Changed</option><option value="unchanged">Unchanged</option></select><select id="type" aria-label="Node type filter"><option value="all">All node types</option></select><button id="reset" type="button">Reset view</button><div class="timeline"><span>Before</span><input id="time" type="range" min="0" max="1" step="0.01" value="1" aria-label="Diff timeline"><span>After</span></div><div class="spacer"></div><div class="legend"><span><i class="dot" style="background:var(--add)"></i> added</span><span><i class="dot" style="background:var(--remove)"></i> removed</span><span><i class="dot" style="background:var(--change)"></i> changed</span></div></header>
<main class="stage" id="stage"><canvas id="canvas" aria-label="Interactive repository ontology graph"></canvas><div class="hud" id="hud">Load a graph or use an embedded bundle.</div></main>
<aside class="side"><div class="searchBox"><label for="search" class="sr">Search graph</label><input id="search" type="search" placeholder="Search nodes, files, sections, findings…" autocomplete="off"></div><div class="results" id="results" aria-live="polite"></div><section class="inspector" id="inspector"><h2>Selection</h2><div class="notice">Tap or click a node to inspect its provenance, diff state, and relationships.</div></section></aside>
</div>
<script id="graph-data" type="application/json">{"embedded":false}</script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d',{alpha:false}),stage=$('stage');
const state={raw:null,nodes:[],edges:[],byId:new Map(),adj:new Map(),mode:'2d',status:'all',type:'all',query:'',selected:null,zoom:1,panX:0,panY:0,yaw:0,pitch:-.18,time:1,drag:null,dpr:1};
const color={added:'#35d07f',removed:'#ff6666',changed:'#f7c948',unchanged:'#718096',finding:'#cf8cff'};
const typeRadius={Repository:10,Domain:7,Role:6,GovernanceFinding:7,GovernanceDecision:6,Workflow:5,AgentContract:5,Interface:5,Schema:5,DevelopmentDocument:5,File:3.4,Section:3,Concept:2.6,SectionContentRef:2};
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seeded(id,k=0){let x=hash(id+'|'+k);x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967295}
function normalize(data){const nodes=(data.nodes||[]).map(n=>({...n,diffStatus:n.diffStatus||'unchanged'}));const edges=(data.edges||[]).map(e=>({...e,diffStatus:e.diffStatus||'unchanged'}));const groups=[...new Set(nodes.map(n=>n.type||'Unknown'))].sort();const gi=new Map(groups.map((g,i)=>[g,i]));for(const n of nodes){const i=gi.get(n.type||'Unknown'),a=(i/groups.length)*Math.PI*2,r=180+45*(i%4),j=(seeded(n.id,1)-.5)*90;n.x=Math.cos(a)*r+(seeded(n.id,2)-.5)*160;n.y=Math.sin(a)*r+(seeded(n.id,3)-.5)*160+n.type?.length*1.7;n.z=(seeded(n.id,4)-.5)*420+j;if(n.type==='Repository'){n.x=n.y=n.z=0}}return {nodes,edges};}
function load(data){if(!data||!Array.isArray(data.nodes)||!Array.isArray(data.edges))throw new Error('Expected a graph JSON object with nodes[] and edges[].');const g=normalize(data);state.raw=data;state.nodes=g.nodes;state.edges=g.edges;state.byId=new Map(g.nodes.map(n=>[n.id,n]));state.adj=new Map();for(const e of g.edges){if(!state.adj.has(e.from))state.adj.set(e.from,[]);if(!state.adj.has(e.to))state.adj.set(e.to,[]);state.adj.get(e.from).push(e);state.adj.get(e.to).push(e)}populateTypes();state.selected=null;resetView();renderResults();inspect(null);draw();}
function populateTypes(){const el=$('type'),cur=el.value;while(el.options.length>1)el.remove(1);for(const t of [...new Set(state.nodes.map(n=>n.type))].sort()){const o=document.createElement('option');o.value=t;o.textContent=t;el.appendChild(o)}el.value=[...el.options].some(o=>o.value===cur)?cur:'all'}
function alphaFor(status){const t=state.time;if(status==='added')return .12+.88*t;if(status==='removed')return .12+.88*(1-t);return status==='unchanged'?.55:1}
function visible(n){return (state.status==='all'||n.diffStatus===state.status)&&(state.type==='all'||n.type===state.type)}
function project(n){let x=n.x,y=n.y,z=n.z;if(state.mode==='3d'){const cy=Math.cos(state.yaw),sy=Math.sin(state.yaw),cp=Math.cos(state.pitch),sp=Math.sin(state.pitch);const x1=x*cy-z*sy,z1=x*sy+z*cy,y1=y*cp-z1*sp,z2=y*sp+z1*cp;const p=700/(700+z2);x=x1*p;y=y1*p}else z=0;return {x:canvas.width/2+(x*state.zoom+state.panX)*state.dpr,y:canvas.height/2+(y*state.zoom+state.panY)*state.dpr,z}}
function resize(){const r=stage.getBoundingClientRect();state.dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.max(1,Math.floor(r.width*state.dpr));canvas.height=Math.max(1,Math.floor(r.height*state.dpr));draw()}
function draw(){if(!ctx)return;ctx.fillStyle='#0a0d12';ctx.fillRect(0,0,canvas.width,canvas.height);if(!state.nodes.length)return;const q=state.query.toLowerCase(),matched=new Set(q?state.nodes.filter(n=>text(n).includes(q)).map(n=>n.id):[]);ctx.lineWidth=.65*state.dpr;let edgeDrawn=0;for(const e of state.edges){const a=state.byId.get(e.from),b=state.byId.get(e.to);if(!a||!b||!visible(a)||!visible(b))continue;if(edgeDrawn++>5000)break;const pa=project(a),pb=project(b),aa=Math.min(alphaFor(e.diffStatus||'unchanged'),q&&!(matched.has(a.id)||matched.has(b.id))?.08:.34);ctx.globalAlpha=aa;ctx.strokeStyle=color[e.diffStatus]||'#344054';ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke()}const ordered=state.nodes.filter(visible).map(n=>({n,p:project(n)})).sort((a,b)=>a.p.z-b.p.z);for(const {n,p} of ordered){const isMatch=!q||matched.has(n.id),r=(typeRadius[n.type]||3)*(state.mode==='3d'?Math.max(.55,1-p.z/1500):1)*state.dpr;ctx.globalAlpha=alphaFor(n.diffStatus)*(isMatch?1:.09);ctx.fillStyle=n.type==='GovernanceFinding'?color.finding:(color[n.diffStatus]||color.unchanged);ctx.beginPath();if(n.type==='GovernanceFinding'){ctx.moveTo(p.x,p.y-r*1.25);ctx.lineTo(p.x-r,p.y+r);ctx.lineTo(p.x+r,p.y+r);ctx.closePath()}else ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();if(state.selected===n.id){ctx.globalAlpha=1;ctx.strokeStyle='#ffffff';ctx.lineWidth=2*state.dpr;ctx.stroke()}}ctx.globalAlpha=1;const s=state.raw?.summary;const c=state.nodes.filter(visible).length;$('hud').textContent=`${state.mode.toUpperCase()} · ${c.toLocaleString()} nodes · ${state.edges.length.toLocaleString()} edges${s?` · +${s.nodes?.added||0} / −${s.nodes?.removed||0} / Δ${s.nodes?.changed||0}`:''}`;}
function text(n){return JSON.stringify([n.id,n.type,n.label,n.path,n.heading,n.message,n.rule,n.category,n.domain,n.owner]).toLowerCase()}
function renderResults(){const box=$('results');box.textContent='';const q=state.query.trim().toLowerCase();if(!q){const d=document.createElement('div');d.className='notice';d.textContent='Search dynamically across IDs, paths, headings, concepts, roles, and governance findings.';box.appendChild(d);draw();return}const rows=state.nodes.filter(n=>text(n).includes(q)&&visible(n)).slice(0,40);for(const n of rows){const b=document.createElement('button');b.type='button';b.className='result';const strong=document.createElement('strong');strong.textContent=n.label||n.heading||n.path||n.id;const small=document.createElement('small');small.textContent=`${n.type} · ${n.diffStatus} · ${n.id}`;b.append(strong,small);b.onclick=()=>select(n.id,true);box.appendChild(b)}if(!rows.length){const d=document.createElement('div');d.className='notice';d.textContent='No matching nodes under the current filters.';box.appendChild(d)}draw()}
function inspect(n){const box=$('inspector');box.textContent='';const h=document.createElement('h2');h.textContent=n?(n.label||n.heading||n.path||n.id):'Selection';box.appendChild(h);if(!n){const d=document.createElement('div');d.className='notice';d.textContent='Tap or click a node to inspect its provenance, diff state, and relationships.';box.appendChild(d);return}for(const tag of [n.type,n.diffStatus,n.severity,n.category].filter(Boolean)){const s=document.createElement('span');s.className='badge';s.textContent=tag;box.appendChild(s)}const dl=document.createElement('dl');dl.className='kv';const fields=['id','path','heading','domain','owner','rule','message','startLine','ownEndLine','subtreeEndLine','sha256','fingerprint'];for(const k of fields)if(n[k]!==undefined){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=typeof n[k]==='object'?JSON.stringify(n[k]):String(n[k]);dl.append(dt,dd)}box.appendChild(dl);const rel=state.adj.get(n.id)||[];const rh=document.createElement('h2');rh.textContent=`Relationships (${rel.length})`;box.appendChild(rh);for(const e of rel.slice(0,30)){const other=e.from===n.id?e.to:e.from,b=document.createElement('button');b.type='button';b.className='result';b.textContent=`${e.type} → ${other}`;b.onclick=()=>select(other,true);box.appendChild(b)}}
function select(id,center=false){state.selected=id;const n=state.byId.get(id);inspect(n);if(center&&n){state.panX=-n.x*state.zoom;state.panY=-n.y*state.zoom}draw()}
function resetView(){state.zoom=1;state.panX=state.panY=0;state.yaw=0;state.pitch=-.18;$('time').value='1';state.time=1;draw()}
function hit(clientX,clientY){const r=canvas.getBoundingClientRect(),x=(clientX-r.left)*state.dpr,y=(clientY-r.top)*state.dpr;let best=null,bd=14*state.dpr;for(const n of state.nodes){if(!visible(n))continue;const p=project(n),d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=n}}return best}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);state.drag={x:e.clientX,y:e.clientY,moved:false}});canvas.addEventListener('pointermove',e=>{if(!state.drag)return;const dx=e.clientX-state.drag.x,dy=e.clientY-state.drag.y;if(Math.abs(dx)+Math.abs(dy)>2)state.drag.moved=true;state.drag.x=e.clientX;state.drag.y=e.clientY;if(state.mode==='3d'){state.yaw+=dx*.008;state.pitch=Math.max(-1.4,Math.min(1.4,state.pitch+dy*.008))}else{state.panX+=dx/state.dpr;state.panY+=dy/state.dpr}draw()});canvas.addEventListener('pointerup',e=>{if(state.drag&&!state.drag.moved){const n=hit(e.clientX,e.clientY);if(n)select(n.id)}state.drag=null});canvas.addEventListener('wheel',e=>{e.preventDefault();state.zoom=Math.max(.18,Math.min(8,state.zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});
$('file').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>30*1024*1024){alert('Graph file exceeds the 30 MB local safety cap.');return}try{load(JSON.parse(await f.text()))}catch(err){alert(`Could not load graph: ${err.message}`)}});$('search').addEventListener('input',e=>{state.query=e.target.value;renderResults()});$('status').onchange=e=>{state.status=e.target.value;renderResults()};$('type').onchange=e=>{state.type=e.target.value;renderResults()};$('time').oninput=e=>{state.time=Number(e.target.value);draw()};$('reset').onclick=resetView;$('mode2d').onclick=()=>{state.mode='2d';$('mode2d').setAttribute('aria-pressed','true');$('mode3d').setAttribute('aria-pressed','false');draw()};$('mode3d').onclick=()=>{state.mode='3d';$('mode2d').setAttribute('aria-pressed','false');$('mode3d').setAttribute('aria-pressed','true');draw()};window.addEventListener('resize',resize);
try{const embedded=JSON.parse($('graph-data').textContent);if(embedded&&Array.isArray(embedded.nodes))load(embedded)}catch(e){console.error('Embedded graph parse failed',e)}resize();
})();
</script>
</body>
</html>
